<svg xmlns="https://masterbundles.com/wp-content/uploads/2024/02/wildflower_line_art_preview_photo-01-814.jpg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Placeholder hero image of a home with botanical accents">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f0e3"/>
      <stop offset="55%" stop-color="#f4f7f2"/>
      <stop offset="100%" stop-color="#faf5e8"/>
